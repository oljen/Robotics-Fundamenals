      '     you have kd = '+nf(sim.sl.kd.v,1)+'   \u2192  \u03b6 = '+nf(sim.S.ze,2);};
  return sim;
});

L('Control','What I does, and why you reach for it last','u = kp·e + ki·∫e dt − kd·ẋ',
`Add a constant disturbance — gravity on an arm, a spring, stiction — and P settles with a permanent offset, because
it needs a non-zero error to generate the force that holds against it. Steady-state error is exactly
<code>disturbance / kp</code>. The integral term accumulates that leftover error until it produces the force
needed, then holds it, and the offset goes to zero.`,
`<p>Now turn <code>ki</code> up too far. The integral keeps winding while the system is still travelling, so it
arrives already committed to a huge push — overshoot, then a long slow limp cycle. Saturate the actuator and it gets
worse: the integral winds up against a limit it can't exceed and takes forever to unwind.</p>
<p><b>Why you avoid it in robotics.</b> I adds lag and eats phase margin, it winds up whenever the actuator
saturates, it integrates sensor bias, and it makes the response depend on history rather than the current state.
When you know the disturbance — and in robotics you usually do, because it's gravity and you have a model — you can
just <em>add it</em>. Switch on feed-forward and watch the offset vanish with ki = 0, no lag, no windup.</p>`,
host=>pdSim(host,{kp:30,kd:9,ki:0,showKd:1,showKi:1,showM:1,showDist:1,dist:-5,showFF:1,sat:40,
  label:'constant disturbance pulling down',eq:'e_ss = disturbance / kp'}));

/* ================= FRAMES ================= */

L('Frames','World frame vs body frame','p_body = Rᵀ (p_world − t)',
`The same point has different coordinates depending on who's asking. The <b>world frame</b> is bolted to the room:
the goal is at (2.0, 1.0) and stays there. The <b>body frame</b> rides on the robot: the same landmark is "1.4 m
ahead and 0.6 m to the left of <em>me</em>", and those numbers change every time the robot turns — even when it
hasn't moved.`,
`<p>Drive with the arrow keys. The world coordinates of the landmark never change. The body coordinates change
constantly. Rotate on the spot: world numbers frozen, body numbers spinning.</p>
<p>Rule of thumb: anything about <b>where things are</b> lives in the world frame. Anything a sensor on the robot
reports, or an actuator on the robot produces, is <em>born</em> in the body frame. Nearly every frame bug is one
missing rotation between those two facts.</p>`,
host=>{
  const b=scope(host,'arrow keys to drive · drag to place the robot','same point, two answers');
  const cv=makeCanvas(b,320);
  const row=controls(host);
  const hd=slider(row,{label:'heading θ',min:-180,max:180,step:1,value:25,unit:'°',dec:0});
  const st=stats(host);
  st.add('w','landmark in WORLD',C.ch1).add('bd','landmark in BODY',C.frame)
    .add('rw','robot in WORLD',C.ch1).add('th','heading');
  const LM=[2.0,1.0];
  let px=-0.6,py=-0.4;
  let geo={};
  onDrag(cv,pt=>{px=(pt[0]-geo.ox)/geo.S; py=-(pt[1]-geo.oy)/geo.S;});
  return{
    step(dt){
      const th=hd.v*Math.PI/180;
      if(keys.arrowleft)hd.v=hd.v-90*dt; if(keys.arrowright)hd.v=hd.v+90*dt;
      if(hd.v>180)hd.v=hd.v-360; if(hd.v<-180)hd.v=hd.v+360;
      const sp=(keys.arrowup?1:0)-(keys.arrowdown?1:0);
      px+=Math.cos(th)*sp*1.2*dt; py+=Math.sin(th)*sp*1.2*dt;
      px=clamp(px,-2.6,2.6); py=clamp(py,-1.6,1.6);
      const dx=LM[0]-px, dy=LM[1]-py;
      const bx= Math.cos(th)*dx+Math.sin(th)*dy;
      const by=-Math.sin(th)*dx+Math.cos(th)*dy;
      st.set('w','('+nf(LM[0],2)+', '+nf(LM[1],2)+')');
      st.set('bd','('+nf(bx,2)+', '+nf(by,2)+')');
      st.set('rw','('+nf(px,2)+', '+nf(py,2)+')');
      st.set('th',nf(hd.v,0)+'°');
      this._b=[bx,by];},
    draw(){const {ctx,W,H}=cv; ctx.clearRect(0,0,W,H);
      const S=Math.min(W/6.4,H/3.6), ox=W*.42, oy=H*.62; geo={ox,oy,S};
      const X=x=>ox+x*S, Y=y=>oy-y*S;
      ctx.strokeStyle=C.rule2; ctx.lineWidth=1;
      for(let i=-3;i<=3;i++){ctx.beginPath(); ctx.moveTo(X(i),0); ctx.lineTo(X(i),H); ctx.stroke();}
      for(let i=-2;i<=2;i++){ctx.beginPath(); ctx.moveTo(0,Y(i)); ctx.lineTo(W,Y(i)); ctx.stroke();}
      // world frame
      arrow(ctx,X(0),Y(0),X(0)+S*.9,Y(0),C.ch1,2.5,9); arrow(ctx,X(0),Y(0),X(0),Y(0)-S*.9,C.ch1,2.5,9);
      label(ctx,X(0)+S*.9+12,Y(0)+4,'X world',C.ch1,10,'left');
      label(ctx,X(0)+4,Y(0)-S*.9-10,'Y world',C.ch1,10,'left');
      // landmark
      ctx.fillStyle=C.ch2; ctx.beginPath(); ctx.arc(X(LM[0]),Y(LM[1]),7,0,TAU); ctx.fill();
      label(ctx,X(LM[0]),Y(LM[1])-18,'landmark',C.ch2,10);
      const th=hd.v*Math.PI/180, rx=X(px), ry=Y(py);
      // body frame
      arrow(ctx,rx,ry,rx+Math.cos(th)*S*.75,ry-Math.sin(th)*S*.75,C.frame,2.5,9);
      arrow(ctx,rx,ry,rx-Math.sin(th)*S*.75,ry-Math.cos(th)*S*.75,C.frame,2.5,9);
      label(ctx,rx+Math.cos(th)*S*.85,ry-Math.sin(th)*S*.85-10,'x body',C.frame,10);
      label(ctx,rx-Math.sin(th)*S*.9,ry-Math.cos(th)*S*.9-8,'y body',C.frame,10);
      // link
      ctx.strokeStyle=C.ch2; ctx.setLineDash([4,4]); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(X(LM[0]),Y(LM[1])); ctx.stroke(); ctx.setLineDash([]);
      // robot body
      ctx.save(); ctx.translate(rx,ry); ctx.rotate(-th);
      ctx.fillStyle='#1a2740'; ctx.strokeStyle=C.frame; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(-13,12); ctx.lineTo(-8,0); ctx.lineTo(-13,-12);
      ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      if(this._b)label(ctx,(rx+X(LM[0]))/2,(ry+Y(LM[1]))/2-12,
        'body: ('+nf(this._b[0],2)+', '+nf(this._b[1],2)+')',C.frame,10);
      label(ctx,W-8,H-12,'\u2191\u2193 drive · \u2190\u2192 turn · drag to reposition',C.dim,9.5,'right');}};
});

L('Frames','Why the wrench is body-frame but the position is world-frame','F_world = R(θ) · F_body',
`A thruster, a wheel, a gripper: all of them push along an axis <em>attached to the robot</em>. That force-and-torque
pair is called a <b>wrench</b>, and it is born in the body frame — "1 N forward" means forward relative to the robot,
not relative to the room. But the goal you're steering toward is a place in the room. Integrating a body-frame force
directly into a world-frame position is the single most common frame bug there is.`,
`<p>Leave the thruster on and give the robot some spin. Applied in the <b>body frame</b> the force sweeps round with
the robot and the path curls into a circle. Switch to <b>world frame</b> and the same magnitude drives a straight
line. Only one of these is what the hardware actually does.</p>
<p>The conversion is one rotation: <code>F_world = R(θ)·F_body</code>, and going the other way <code>R</code>
transposed. Torques rotate too. Get in the habit of putting the frame in the variable name — <code>F_body</code>,
<code>p_world</code>, <code>v_body</code> — and the bug becomes visible in the code instead of on the floor.</p>`,
host=>{
  const b=scope(host,'thruster fixed to the hull','F_world = R(θ) · F_body');
  const cv=makeCanvas(b,320);
  const row=controls(host);
  const F=slider(row,{label:'thruster force (along body +x)',min:0,max:3,step:.05,value:1.2,unit:'N',dec:2});
  const w=slider(row,{label:'body spin rate ω',min:-1.5,max:1.5,step:.02,value:.55,unit:'rad/s',dec:2});
  const br=btnrow(row);
  let bodyFrame=true;
  toggle(br,'Apply in body frame',true,v=>bodyFrame=v);
  button(br,'Reset',()=>{px=py=vx=vy=0;th=0;trail.length=0;});
  const st=stats(host);
  st.add('fb','F in BODY',C.frame).add('fw','F in WORLD',C.ch3).add('R','R(θ) row 1').add('p','position',C.ch1).add('sp','speed',C.ch2);
  let px=0,py=0,vx=0,vy=0,th=0; const trail=[];
  return{
    step(dt){dt=Math.min(dt,.03); th+=w.v*dt;
      const c=Math.cos(th), s=Math.sin(th);
      const fb=[F.v,0];
      const fw=bodyFrame?[c*fb[0]-s*fb[1], s*fb[0]+c*fb[1]]:[F.v,0];
      const m=1.5;
      vx+=fw[0]/m*dt; vy+=fw[1]/m*dt; px+=vx*dt; py+=vy*dt;
      if(Math.abs(px)>4||Math.abs(py)>3){px=py=vx=vy=0; trail.length=0;}
      trail.push([px,py]); if(trail.length>900)trail.shift();
      st.set('fb','('+nf(fb[0],2)+', '+nf(fb[1],2)+') N');
      st.set('fw','('+nf(fw[0],2)+', '+nf(fw[1],2)+') N');
      st.set('R','[ '+nf(c,2)+'  '+nf(-s,2)+' ]');
      st.set('p','('+nf(px,2)+', '+nf(py,2)+')');
      st.set('sp',nf(Math.hypot(vx,vy),2)+' m/s');
      this._fw=fw;},
    draw(){const {ctx,W,H}=cv; ctx.clearRect(0,0,W,H);
      const S=Math.min(W/8.6,H/6.2), ox=W*.5, oy=H*.5;
      const X=x=>ox+x*S, Y=y=>oy-y*S;
      ctx.strokeStyle=C.rule2;
      for(let i=-4;i<=4;i++){ctx.beginPath(); ctx.moveTo(X(i),0); ctx.lineTo(X(i),H); ctx.stroke();}
      for(let i=-3;i<=3;i++){ctx.beginPath(); ctx.moveTo(0,Y(i)); ctx.lineTo(W,Y(i)); ctx.stroke();}
      arrow(ctx,X(0),Y(0),X(0)+S*.8,Y(0),C.ch1,1.6,7); arrow(ctx,X(0),Y(0),X(0),Y(0)-S*.8,C.ch1,1.6,7);
      label(ctx,X(0)+S*.8+10,Y(0)+2,'world',C.ch1,9.5,'left');
      ctx.strokeStyle=C.ch2; ctx.lineWidth=1.6; ctx.beginPath();
      trail.forEach((p,i)=>{i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1]));}); ctx.stroke();
      const rx=X(px), ry=Y(py), c=Math.cos(th), s=Math.sin(th);
      const fw=this._fw||[0,0];
      arrow(ctx,rx,ry,rx+fw[0]*44,ry-fw[1]*44,C.ch3,3,10);
      label(ctx,rx+fw[0]*44+10,ry-fw[1]*44-10,'F applied',C.ch3,10,'left');
      ctx.save(); ctx.translate(rx,ry); ctx.rotate(-th);
      ctx.strokeStyle=C.frame; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(34,0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-34); ctx.stroke();
      ctx.fillStyle='#1a2740'; ctx.strokeStyle=C.frame; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(-14,13); ctx.lineTo(-9,0); ctx.lineTo(-14,-13);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle=C.ch3; ctx.fillRect(-16,-5,7,10);
      ctx.restore();
      label(ctx,W/2,20,bodyFrame?'force applied in BODY frame — sweeps with the hull':'force applied in WORLD frame — fixed direction',
        bodyFrame?C.frame:C.ch1,11);}};
});
</script>
<script>
/* ================= app ================= */
initColors();
const navEl=document.getElementById('nav'), hostEl=document.getElementById('lesson');
const prevB=document.getElementById('prev'), nextB=document.getElementById('next');
let idx=0, cur=null, items=[];
let lastGroup='';
LESSONS.forEach((l,i)=>{
  if(l.group!==lastGroup){lastGroup=l.group; navEl.appendChild(el('div','grp',l.group));}
  const a=el('div','nav-i','<b>'+String(i+1).padStart(2,'0')+'</b><span>'+l.title+'</span>');
  a.tabIndex=0; a.setAttribute('role','button');
  const pick=()=>{go(i); document.getElementById('rail').classList.remove('open');};
  a.onclick=pick;
  a.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); pick();}};
  navEl.appendChild(a); items.push(a);
});
function go(i){
  idx=clamp(i,0,LESSONS.length-1);
  const l=LESSONS[idx];
  items.forEach((a,k)=>a.classList.toggle('on',k===idx));
  hostEl.innerHTML=''; cur=null;
  const head=el('div');
  head.appendChild(el('div','eyebrow','<s></s>'+l.group));
  head.appendChild(el('h2','title','<span>'+l.title+'</span><em>'+String(idx+1).padStart(2,'0')+' / 22</em>'));
  head.appendChild(el('p','brief',l.brief));
  hostEl.appendChild(head);
  try{ cur=l.build(hostEl); }
  catch(err){ console.error(err); hostEl.appendChild(el('div','notice','<h5>this panel failed to start</h5><p>'+err.message+'</p>')); }
  hostEl.appendChild(el('div','notice','<h5>what to notice</h5>'+l.notice));
  const p=LESSONS[idx-1], n=LESSONS[idx+1];
  prevB.disabled=!p; nextB.disabled=!n;
  prevB.innerHTML=p?'<u>previous</u>'+p.title:'<u>start of the sequence</u>';
  nextB.innerHTML=n?'<u>next</u>'+n.title:'<u>you\u2019ve reached the end</u>';
  history.replaceState(null,'','#'+(idx+1));
  window.scrollTo({top:0,behavior:'instant'});
}
prevB.onclick=()=>go(idx-1); nextB.onclick=()=>go(idx+1);
document.getElementById('burger').onclick=()=>document.getElementById('rail').classList.toggle('open');
let last=performance.now(), warned=false;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000)||0.016; last=now;
  if(cur){
    try{ if(cur.step)cur.step(dt); if(cur.draw)cur.draw(); }
    catch(e){ if(!warned){console.error(e); warned=true;} }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
const start=parseInt((location.hash||'').replace('#',''),10);
go(isFinite(start)&&start>=1&&start<=LESSONS.length?start-1:0);
</script>
</body>
